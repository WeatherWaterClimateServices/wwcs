map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    root /var/www/html;
    index index.html;
    server_name wwcs.tj www.wwcs.tj;

    access_log /var/log/nginx/wwcstj_access_ssl.log;
    error_log /var/log/nginx/wwcstj_error_ssl.log;

    location / {
        try_files $uri $uri/ =404;
    }

    location /weather_icons/ {
    }

    location /dashboard/ {
        proxy_pass http://127.0.0.1:3838/dashboard/;
        proxy_redirect http://127.0.0.1:3838/dashboard/ http://$host/dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
    }

    location /test/ {
        proxy_pass http://127.0.0.1:3838/test/;
        proxy_redirect http://127.0.0.1:3838/test/ http://$host/test/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 20d;
    }

    location /eco-airq/ {
        proxy_pass http://127.0.0.1:3838/eco-airq/;
        proxy_redirect http://127.0.0.1:3838/eco-airq/ http://$host/eco-airq/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 20d;
    }

    location /status/ {
        proxy_pass http://127.0.0.1:3838/server-status/;
        proxy_redirect http://127.0.0.1:3838/server-status/ http://$host/server-status/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 20d;
    }

    location /ews/ {
        proxy_pass http://127.0.0.1:3838/ews/;
        proxy_redirect http://127.0.0.1:3838/ews/ http://$host/ews/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 20d;
    }

     location /harvest/ {
        proxy_pass http://127.0.0.1:3838/harvest/;
        proxy_redirect http://127.0.0.1:3838/harvest/ http://$host/harvest/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 20d;
    }

    location /grafana/ {
        proxy_pass http://localhost:3000/;
        # WebSockets support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    location /home/ {
        proxy_pass http://127.0.0.1:3838/home/;
        proxy_redirect http://127.0.0.1:3838/home/ http://$host/home/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 20d;
    }

    location /irrigation/ {
        proxy_pass http://127.0.0.1:3838/irrigation/;
        proxy_redirect http://127.0.0.1:3838/irrigation/ http://$host/irrigation/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 20d;
    }

    location /planting/ {
        proxy_pass http://127.0.0.1:3838/planting/;
        proxy_redirect http://127.0.0.1:3838/planting/ http://$host/planting/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 20d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3838/api/;
        proxy_redirect http://127.0.0.1:3838/api/ http://$host/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 20d;
    }

    location /map/ {
        proxy_pass http://127.0.0.1:3838/map/;
        proxy_redirect http://127.0.0.1:3838/map/ http://$host/map/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 20d;
    }

    location /rstudio/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_redirect http://127.0.0.1:8787/ https://$host/rstudio/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Station ingestion (legacy api_station on 127.0.0.1:5000). During the
    # coexistence phase every request is mirrored to wwcs-core (Django,
    # served under /core/) so both databases receive the same rows. The
    # mirrored response is discarded; the logger only sees the legacy
    # response. Remove `mirror @wwcs_core;` at cutover.
    location /post/ {
        mirror @wwcs_core;
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Mirror target: forwards a copy of /post/<x> to wwcs-core's gunicorn
    # socket as /core/api/<x> (the external form). Gunicorn strips the
    # /core prefix (SCRIPT_NAME=/core in wwcs-core/.env) before Django, and
    # rejects any path not starting with /core — so the rewrite must include
    # the prefix. The station signature covers payload fields only, so the
    # path rewrite does not affect authentication. Fire-and-forget: failures
    # go to the nginx error log, never to the logger.
    location @wwcs_core {
        rewrite ^/post/(.*)$ /core/api/$1 break;
        proxy_pass http://unix:/home/wwcs/wwcs-core/var/run/gunicorn.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /services/ {
        proxy_pass http://127.0.0.1:5052/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /observations/ {
        proxy_pass http://127.0.0.1:5052/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /flowmeter/ {
        proxy_pass http://unix:/home/flowmeter/flowmeter/var/run/flowmeter.sock:/flowmeter/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    location /flowmeter/static/ {
        alias /home/flowmeter/flowmeter/staticfiles/;
    }

    location /core/ {
        proxy_pass http://unix:/home/wwcs/wwcs-core/var/run/gunicorn.sock:/core/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    location /core/static/ {
        alias /home/wwcs/wwcs-core/var/static/;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wwcs.tj/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wwcs.tj/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.wwcs.tj) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name wwcs.tj www.wwcs.tj;

    access_log /var/log/nginx/wwcstj_access.log;
    error_log /var/log/nginx/wwcstj_error.log;

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    if ($host = wwcs.tj) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name wwcs.tj www.wwcs.tj;
    listen 80;
    return 404; # managed by Certbot
}
